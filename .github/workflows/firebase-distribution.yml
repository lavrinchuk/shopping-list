name: Distribute ShoppingList to Firebase

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: firebase-test-distribution
  cancel-in-progress: false

jobs:
  distribute:
    name: Build, verify and distribute APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      FIREBASE_APP_ID: ${{ vars.FIREBASE_APP_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 37
        run: sdkmanager 'platforms;android-37'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Restore signing key and Firebase credentials
        env:
          ANDROID_DEBUG_KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_B64 }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${FIREBASE_APP_ID:-}" || { echo 'Missing repository variable FIREBASE_APP_ID' >&2; exit 1; }
          test -n "${ANDROID_DEBUG_KEYSTORE_B64:-}" || { echo 'Missing secret ANDROID_DEBUG_KEYSTORE_B64' >&2; exit 1; }
          test -n "${FIREBASE_SERVICE_ACCOUNT_JSON:-}" || { echo 'Missing secret FIREBASE_SERVICE_ACCOUNT_JSON' >&2; exit 1; }

          mkdir -p "$HOME/.android"
          printf '%s' "$ANDROID_DEBUG_KEYSTORE_B64" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"

          credentials_file="$RUNNER_TEMP/firebase-service-account.json"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$credentials_file"
          chmod 600 "$credentials_file"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$credentials_file" >> "$GITHUB_ENV"

      - name: Build and run JVM tests and lint
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug --no-daemon --no-configuration-cache

      - name: Upload to Firebase App Distribution
        run: ./gradlew :app:appDistributionUploadDebug --no-daemon --no-configuration-cache

      - name: Preserve APK as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: shopping-list-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
