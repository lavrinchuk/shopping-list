name: Android PR CI

on:
  pull_request:
    branches:
      - master
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read

concurrency:
  group: android-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify-android-pr:
    name: verify-android-pr
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout pull request
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android API 37.0
        run: sdkmanager 'platforms;android-37.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build, run unit tests and lint
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug --no-daemon --no-configuration-cache

      - name: JaCoCo coverage and SpotBugs static analysis
        run: ./gradlew :app:createDebugUnitTestCoverageReport :app:spotbugsDebug --no-daemon --no-configuration-cache

      - name: Upload test, lint, coverage and SpotBugs reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-pr-quality-reports
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
            app/build/reports/lint-results-debug.*
            app/build/reports/coverage/test/debug/
            app/build/reports/spotbugs/
          if-no-files-found: warn
          retention-days: 7
