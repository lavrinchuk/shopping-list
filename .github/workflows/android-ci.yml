name: Android PR CI

on:
  pull_request:
    branches:
      - master
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read

concurrency:
  group: android-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify-android-pr:
    name: verify-android-pr
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout pull request
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android API 37.0
        run: sdkmanager 'platforms;android-37.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # Temporary formatting capture; restored before final PR review.
      - name: Generate canonical formatting
        run: |
          ./gradlew spotlessApply --no-daemon --no-configuration-cache
          python3 - <<'PY'
          import base64
          from pathlib import Path
          files = [
              Path("app/src/main/java/com/example/shoppinglist/MainActivity.java"),
              Path("app/src/main/java/com/example/shoppinglist/ListsActivity.java")
          ]
          for path in files:
              print(f"FORMATTED_ACTIVITY {path} {base64.b64encode(path.read_bytes()).decode('ascii')}")
          PY

      - name: Check Java code style
        run: ./gradlew spotlessCheck --no-daemon --no-configuration-cache

      - name: Build, run unit tests and lint
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug --no-daemon --no-configuration-cache

      - name: Compile Android instrumentation tests (no emulator required)
        run: ./gradlew :app:compileDebugAndroidTestJavaWithJavac --no-daemon --no-configuration-cache

      - name: JaCoCo coverage and SpotBugs static analysis
        run: ./gradlew :app:createDebugUnitTestCoverageReport :app:spotbugsDebug --no-daemon --no-configuration-cache

      - name: Verify SpotBugs inputs and report
        shell: bash
        run: |
          python3 - <<'PY'
          import sys
          import zipfile
          import xml.etree.ElementTree as ET
          from pathlib import Path

          jar = Path("app/build/intermediates/spotbugs/spotbugs-debug-classes.jar").resolve()
          report = Path("app/build/reports/spotbugs/debug.xml")
          with zipfile.ZipFile(jar) as archive:
              compiled = {name.removesuffix(".class").replace("/", ".")
                          for name in archive.namelist() if name.endswith(".class")}
          if not compiled:
              sys.exit("SpotBugs input JAR contains no compiled classes")

          root = ET.parse(report).getroot()
          if root.tag != "BugCollection":
              sys.exit("Unexpected SpotBugs XML report structure")
          project_jars = {Path(node.text).resolve() for node in root.findall("./Project/Jar")
                          if node.text}
          if jar not in project_jars:
              sys.exit("SpotBugs report does not reference the compiled app JAR")

          errors = root.find("Errors")
          if errors is None or int(errors.get("errors", "-1")) != 0:
              sys.exit("SpotBugs reported internal analysis errors")

          bugs = root.findall("BugInstance")
          bug_classes = {node.get("classname") for bug in bugs
                         for node in bug.findall("./Class")}
          unexpected = bug_classes - compiled
          if unexpected:
              sys.exit(f"SpotBugs findings refer to non-app classes: {sorted(unexpected)}")

          missing = [node.text for node in root.findall("./Errors/MissingClass") if node.text]
          summary = root.find("FindBugsSummary")
          reported_classes = summary.get("total_classes", "n/a") if summary is not None else "n/a"
          print(f"App JAR: {len(compiled)} compiled classes; SpotBugs findings: {len(bugs)}")
          print(f"SpotBugs reported total_classes: {reported_classes} (not a reliable scan-completeness metric)")
          if missing:
              print("Warning: unresolved analysis dependencies: " + ", ".join(sorted(missing)))
          PY

      - name: Upload test, lint, coverage and SpotBugs reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-pr-quality-reports
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
            app/build/reports/lint-results-debug.*
            app/build/reports/coverage/test/debug/
            app/build/reports/spotbugs/
          if-no-files-found: warn
          retention-days: 7
