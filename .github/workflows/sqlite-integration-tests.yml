name: SQLite Android integration tests

on:
  workflow_dispatch:
  pull_request:
    branches:
      - master
    paths:
      - 'app/src/main/java/com/example/shoppinglist/data/**'
      - 'app/src/main/java/com/example/shoppinglist/model/**'
      - 'app/src/androidTest/java/com/example/shoppinglist/ShoppingDatabaseTest.java'
      - '.github/workflows/sqlite-integration-tests.yml'

permissions:
  contents: read

concurrency:
  group: sqlite-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sqlite-on-emulator:
    name: sqlite-on-emulator
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v6
      - name: Run SQLite integration tests on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-boot-timeout: 600
          script: ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.example.shoppinglist.ShoppingDatabaseTest --no-daemon --no-configuration-cache
      - name: Upload Android test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sqlite-integration-test-results
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: warn
          retention-days: 7
