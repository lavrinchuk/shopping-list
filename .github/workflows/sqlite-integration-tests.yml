name: SQLite Android integration tests

on:
  workflow_dispatch:
  pull_request:
    branches:
      - master
    paths:
      - 'app/src/main/java/com/example/shoppinglist/data/**'
      - 'app/src/main/java/com/example/shoppinglist/model/**'
      - 'app/src/androidTest/java/com/example/shoppinglist/ShoppingDatabaseTest.java'
      - 'app/src/androidTest/java/com/example/shoppinglist/ShoppingScreenTest.java'
      - 'app/src/androidTest/java/com/example/shoppinglist/ListsNavigationTest.java'
      - 'app/src/main/java/com/example/shoppinglist/ListsActivity.java'
      - 'app/src/main/java/com/example/shoppinglist/TemplateEditorActivity.java'
      - 'app/src/main/res/layout/activity_template_editor.xml'
      - 'app/src/main/java/com/example/shoppinglist/ShoppingViewModel.java'
      - 'app/src/main/java/com/example/shoppinglist/MainActivity.java'
      - 'app/src/main/java/com/example/shoppinglist/ShoppingAdapter.java'
      - 'app/src/main/res/layout/item_shopping.xml'
      - 'app/src/main/res/drawable/ic_barcode_scan.xml'
      - '.github/workflows/sqlite-integration-tests.yml'

permissions:
  contents: read

concurrency:
  group: sqlite-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sqlite-on-emulator:
    name: sqlite-on-emulator
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v6
      - name: Enable KVM group permissions for accelerated Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Run SQLite integration tests on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-boot-timeout: 600
          script: |
            ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.example.shoppinglist.ShoppingDatabaseTest --no-daemon --no-configuration-cache
            ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.example.shoppinglist.ShoppingScreenTest#multipleStoreOptionsAreVisibleWithTheirNamesAndUrls --no-daemon --no-configuration-cache
            ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.example.shoppinglist.ShoppingScreenTest#barcodeScannerIsAnAccessibleIconInTheItemActionRow --no-daemon --no-configuration-cache
            ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.example.shoppinglist.ShoppingScreenTest#storedBarcodeIsDisplayedAndCanBeCopied --no-daemon --no-configuration-cache
            ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.example.shoppinglist.ShoppingScreenTest#attachingReceiptsOpensGalleryAndThumbnailOpensPreview --no-daemon --no-configuration-cache
            ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.example.shoppinglist.ShoppingScreenTest#tallReceiptDoesNotPushPreviewActionsOffScreen --no-daemon --no-configuration-cache
            ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.example.shoppinglist.ShoppingScreenTest#archivedShoppingListHidesSearchLinksAndShareWithoutLosingData --no-daemon --no-configuration-cache
            ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.example.shoppinglist.ShoppingScreenTest#voiceBatchCanBeEditedAndOnlyConfirmedItemsArePersisted --no-daemon --no-configuration-cache
            ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.example.shoppinglist.ShoppingScreenTest#cancelledVoiceBatchDoesNotWriteItems --no-daemon --no-configuration-cache
            ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.example.shoppinglist.ListsNavigationTest#createShoppingListFromSavedTemplateAndKeepSourceIndependent --no-daemon --no-configuration-cache
            ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.example.shoppinglist.ListsNavigationTest#homeBottomBarOpensTemplatesAndArchiveAndSurvivesRotation --no-daemon --no-configuration-cache
            ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.example.shoppinglist.ListsNavigationTest#editTemplateFullScreenKeepsOriginalListIndependent --no-daemon --no-configuration-cache
      - name: Upload Android test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sqlite-integration-test-results
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: warn
          retention-days: 7
